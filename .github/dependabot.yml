version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Keeps [skip netlify] in Dependabot PR titles and commits, as for every PR.
    commit-message:
      prefix: '[skip netlify]'
    # Major upgrades (ESLint, TypeScript, Vitest, Node types) are planned
    # deliberately and tracked in the release notes, not raised automatically.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Security fixes still open as soon as an advisory is published,
      # but together in one pull request instead of one per package.
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: '[skip netlify]'
    groups:
      actions:
        patterns:
          - '*'
